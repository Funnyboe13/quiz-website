<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Student Quiz{% endblock %}</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --primary-light: #eef2ff;
            --accent: #f59e0b;
            --bg: #f5f5ff;
            --card: #ffffff;
            --text: #1e1b4b;
            --muted: #6b7280;
            --border: #e0e7ff;
            --danger: #dc2626;
            --success: #15803d;
        }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: "Segoe UI", Arial, sans-serif; background: var(--bg); color: var(--text); }
        header { background: linear-gradient(135deg, #4f46e5, #7c3aed); color: white; padding: 18px 24px; }
        header h1 { margin: 0; font-size: 22px; }
        header a { color: white; text-decoration: none; }
        main { max-width: 800px; margin: 28px auto; padding: 0 16px; }
        .card { background: var(--card); border-radius: 12px; padding: 24px; box-shadow: 0 2px 8px rgba(79,70,229,0.08); margin-bottom: 20px; }
        .crumbs { color: var(--muted); margin-bottom: 16px; font-size: 14px; }
        .crumbs a { color: var(--primary); text-decoration: none; }

        .head-row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        nav a, nav span { color: white; margin-left: 14px; text-decoration: none; }
        form.inline { display: inline; margin-left: 14px; }
        .nav-btn { background: transparent; color: white; border: 1px solid white; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 14px; }
        .nav-btn:hover { background: rgba(255,255,255,0.2); }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
        .tile { display: block; background: var(--card); border-radius: 12px; padding: 22px; text-decoration: none; color: var(--text); box-shadow: 0 2px 8px rgba(79,70,229,0.08); border-left: 6px solid var(--accent); }
        .tile:hover { background: var(--primary-light); }
        .tile h3 { margin: 0 0 6px 0; color: var(--primary); }
        .tile p { margin: 0; color: var(--muted); font-size: 14px; }

        .btn { display: inline-block; padding: 12px 22px; border-radius: 8px; border: none; background: var(--primary); color: white; text-decoration: none; font-size: 16px; cursor: pointer; }
        .btn:hover { background: var(--primary-dark); }
        .link-muted { color: var(--muted); margin-left: 12px; text-decoration: none; }

        .question { margin-bottom: 26px; }
        .question h3 { margin: 0 0 10px 0; }
        .option { display: block; padding: 10px 14px; margin-bottom: 8px; border: 1px solid var(--border); border-radius: 8px; cursor: pointer; font-weight: normal; }
        .option:hover { background: var(--primary-light); border-color: var(--primary); }
        .option input { margin-right: 10px; }

        .score { text-align: center; }
        .score .big { font-size: 48px; font-weight: 700; color: var(--primary); }
        .review.right { border-left: 6px solid var(--success); }
        .review.wrong { border-left: 6px solid var(--danger); }
        .tag-right { color: var(--success); font-weight: 600; }
        .tag-wrong { color: var(--danger); font-weight: 600; }
        .explain { background: var(--primary-light); border-radius: 8px; padding: 10px 14px; margin-top: 10px; font-size: 14px; }

        .narrow { max-width: 440px; margin: 0 auto; }
        form p { margin-bottom: 16px; }
        label { display: block; font-weight: 600; margin-bottom: 4px; }
        input[type=text], input[type=password] { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 15px; }
        input[type=text]:focus, input[type=password]:focus { outline: 2px solid var(--primary); border-color: var(--primary); }
        .errorlist { color: var(--danger); list-style: none; padding: 0; margin: 0 0 6px 0; }
        .helptext { color: var(--muted); font-size: 13px; display: block; }
        .helptext ul { padding-left: 18px; margin: 4px 0; }

        .results-table { width: 100%; border-collapse: collapse; }
        .results-table th { background: var(--primary); color: white; text-align: left; padding: 10px; }
        .results-table td { padding: 10px; border-bottom: 1px solid var(--border); }
        .pill { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; }
        .pill.good { background: #dcfce7; color: #15803d; }
        .pill.ok { background: #fef3c7; color: #b45309; }
        .pill.low { background: #fee2e2; color: #b91c1c; }

        .toast-wrap { position: fixed; top: 80px; right: 20px; z-index: 1000; }
        .toast { background: white; border-left: 6px solid var(--primary); box-shadow: 0 6px 20px rgba(0,0,0,0.18); border-radius: 10px; padding: 14px 40px 14px 18px; margin-bottom: 10px; min-width: 240px; position: relative; font-weight: 600; animation: slidein 0.4s ease, fadeout 0.6s ease 4s forwards; }
        .toast.success { border-left-color: var(--success); }
        .toast.error { border-left-color: var(--danger); }
        .toast-close { position: absolute; top: 6px; right: 10px; background: none; border: none; font-size: 20px; cursor: pointer; color: var(--muted); }
        @keyframes slidein { from { transform: translateX(120%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes fadeout { to { opacity: 0; transform: translateY(-10px); } }
    </style>
</head>
<body>
    <header>
        <div class="head-row">
            <h1><a href="{% url 'subject_list' %}">📚 Student Quiz</a></h1>
            <nav>
                {% if user.is_authenticated %}
                    <a href="{% url 'my_results' %}">My results</a>
                    <span>Hi, {{ user.username }}</span>
                    <form method="post" action="{% url 'logout' %}" class="inline">
                        {% csrf_token %}
                        <button type="submit" class="nav-btn">Log out</button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}">Log in</a>
                    <a href="{% url 'signup' %}">Sign up</a>
                {% endif %}
            </nav>
        </div>
    </header>

    {% if messages %}
    <div class="toast-wrap">
        {% for message in messages %}
        <div class="toast {{ message.tags }}">
            {{ message }}
            <button type="button" class="toast-close" onclick="this.parentElement.remove()">&times;</button>
        </div>
        {% endfor %}
    </div>
    <script>
        setTimeout(function () {
            var wrap = document.querySelector('.toast-wrap');
            if (wrap) { wrap.remove(); }
        }, 4700);
    </script>
    {% endif %}

    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
